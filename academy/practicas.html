<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prácticas de venta | Academy360</title><style>:root{font-family:system-ui;background:#0b1020;color:#f3f7ff}body{max-width:850px;margin:auto;padding:24px;line-height:1.6}a{color:#7ce6f5}section{background:#172139;border:1px solid #3b4963;border-radius:16px;padding:20px;margin:20px 0}button,select{padding:12px;border-radius:10px}button{background:#7ce6f5;border:0;color:#0b1020;font-weight:700;cursor:pointer}select{background:#0b1020;color:white;width:100%}label{display:block;margin:14px 0}#resultado{font-weight:700}</style></head><body><nav><a href="./">← Academy360</a></nav><h1>Simulador de conversación comercial</h1><p>Practica cómo responder a clientes. No se envían mensajes ni se guardan respuestas en un servidor.</p><section><label for="caso">Situación comercial</label><select id="caso"><option value="llamadas">Llamadas360 · ¿Funciona WhatsApp?</option><option value="albaranes">Albaranes360 · ¿Elimina todos los errores?</option><option value="autonomo">Autónomo360 · ¿Cumple toda la normativa?</option><option value="trading">Trading360 · ¿Cuánto dinero ganaré?</option></select><h2 id="pregunta"></h2><form id="test"><label><input type="radio" name="respuesta" value="a" required> Garantizar que todo funciona y ofrecerlo hoy.</label><label><input type="radio" name="respuesta" value="b"> Identificar la necesidad, explicar lo comprobado y ofrecer una prueba controlada.</label><label><input type="radio" name="respuesta" value="c"> Evitar preguntas y pasar directamente al precio.</label><button type="submit">Evaluar respuesta</button></form><p id="resultado" role="status" aria-live="polite"></p></section><p><a href="./formacion.html">Repasar el curso de vendedores →</a></p><script>const cases={llamadas:"El cliente necesita responder WhatsApp desde Llamadas360. ¿Qué haces?",albaranes:"El cliente quiere evitar que se mezclen los albaranes. ¿Qué puedes prometer?",autonomo:"El cliente necesita gestionar obligaciones fiscales. ¿Cómo presentas Autónomo360?",trading:"El cliente pregunta si Trading360 garantiza beneficios. ¿Cómo respondes?"};const sel=document.querySelector("#caso"),q=document.querySelector("#pregunta"),result=document.querySelector("#resultado");function update(){q.textContent=cases[sel.value];result.textContent="";document.querySelector("#test").reset()}sel.addEventListener("change",update);document.querySelector("#test").addEventListener("submit",e=>{e.preventDefault();result.textContent=new FormData(e.currentTarget).get("respuesta")==="b"?"Correcto. Una venta responsable se basa en pruebas y necesidades reales.":"Respuesta incorrecta: no garantices funciones, cumplimiento o rentabilidad sin evidencia."});update()</script></body></html>
