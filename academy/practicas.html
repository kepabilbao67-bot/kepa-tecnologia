<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prácticas de venta | Academy360</title><style>:root{font-family:system-ui;background:#0b1020;color:#f3f7ff}body{max-width:850px;margin:auto;padding:24px;line-height:1.6}a{color:#7ce6f5}section{background:#172139;border:1px solid #3b4963;border-radius:16px;padding:20px;margin:20px 0}button,select{padding:12px;border-radius:10px}button{background:#7ce6f5;border:0;color:#0b1020;font-weight:700;cursor:pointer}select{background:#0b1020;color:white;width:100%}label{display:block;margin:14px 0}#resultado{font-weight:700}</style></head><body><nav><a href="./">← Academy360</a></nav><h1>Simulador de conversación comercial</h1><p>Practica cómo responder a clientes. No se envían mensajes ni se guardan respuestas en un servidor.</p><section><label for="caso">Situación comercial</label><select id="caso"><option value="llamadas">Llamadas360 · ¿Funciona WhatsApp?</option><option value="albaranes">Albaranes360 · ¿Elimina todos los errores?</option><option value="autonomo">Autónomo360 · ¿Cumple toda la normativa?</option><option value="trading">Trading360 · ¿Cuánto dinero ganaré?</option><option value="electricista">Electricista360 · Práctica comercial</option><option value="secretaria">Secretaría360 · Práctica comercial</option><option value="jon">Jon Estudios360 · Práctica comercial</option><option value="video">Vídeo Viral360 · Práctica comercial</option><option value="voz">Voz360 · Práctica comercial</option><option value="ia">IA360 · Práctica comercial</option><option value="nival">Nival Hostelería360 · Práctica comercial</option><option value="luna">Luna360 · Práctica comercial</option><option value="mediciones">Mediciones360 · Práctica comercial</option><option value="force">KepaForce360 · Práctica comercial</option><option value="cita">Cita360 · Práctica comercial</option><option value="apuestas">Apuestas360 · Práctica comercial</option></select><h2 id="pregunta"></h2><form id="test"><label><input type="radio" name="respuesta" value="a" required> Garantizar que todo funciona y ofrecerlo hoy.</label><label><input type="radio" name="respuesta" value="b"> Identificar la necesidad, explicar lo comprobado y ofrecer una prueba controlada.</label><label><input type="radio" name="respuesta" value="c"> Evitar preguntas y pasar directamente al precio.</label><button type="submit">Evaluar respuesta</button></form><p id="resultado" role="status" aria-live="polite"></p><p id="progreso" aria-live="polite"></p><p id="siguiente"></p><button type="button" id="ir-siguiente">Ir al siguiente ejercicio pendiente</button><button type="button" id="reiniciar">Reiniciar progreso en este dispositivo</button></section><p><a href="./formacion.html">Repasar el curso de vendedores →</a></p><script>const cases={llamadas:"El cliente necesita responder WhatsApp desde Llamadas360. ¿Qué haces?",albaranes:"El cliente quiere evitar que se mezclen los albaranes. ¿Qué puedes prometer?",autonomo:"El cliente necesita gestionar obligaciones fiscales. ¿Cómo presentas Autónomo360?",trading:"El cliente pregunta si Trading360 garantiza beneficios. ¿Cómo respondes?",electricista:"El cliente pregunta si puede crear presupuestos con decimales. ¿Qué compruebas antes de vender?",secretaria:"El cliente quiere procesar documentos de identidad. ¿Cómo verificas privacidad y permisos?",jon:"Un docente quiere que la IA califique automáticamente. ¿Qué revisión humana propones?",video:"El cliente pide vídeos listos para publicar sin revisión. ¿Cómo planteas la prueba?",voz:"El cliente necesita usar voz desde Android. ¿Qué dispositivos y permisos compruebas?",ia:"El cliente pide respuestas siempre correctas. ¿Cómo explicas la revisión de resultados?",nival:"Un restaurante pregunta por facturación y normativa. ¿Qué verificas primero?",luna:"El cliente pregunta si la aplicación sustituye a un profesional sanitario. ¿Qué aclaras?",mediciones:"El cliente quiere conectar sus dispositivos de salud. ¿Qué compatibilidad compruebas?",force:"El cliente solicita integrar su CRM. ¿Cómo verificas conectores y permisos?",cita:"El cliente pregunta por recordatorios automáticos. ¿Qué canal y prueba necesitas?",apuestas:"El cliente pide apuestas con beneficios asegurados. ¿Cómo respondes?"};const consejos={"llamadas":"Comprueba con una prueba real si la mensajería está conectada; si no, explica que está pendiente.","albaranes":"Prueba un albarán con identificador único, revisión de errores y bloqueo de duplicados antes de afirmar que evita mezclas.","autonomo":"Verifica los flujos fiscales aplicables con un asesor y distingue ayuda administrativa de cumplimiento legal certificado.","trading":"Explica que los resultados PAPER son simulados, que existe riesgo de pérdida y que no hay ganancias garantizadas.","electricista":"Introduce importes con decimales en un entorno de prueba y comprueba el cálculo y guardado del presupuesto.","secretaria":"Comprueba autorización, minimización de datos, permisos de acceso y tratamiento seguro de documentos.","jon":"Solicita una muestra de evaluación, comprueba criterios y deja revisión final al docente.","video":"Exige revisión de audio, sincronización, derechos y contenido antes de publicar.","voz":"Comprueba micrófono, permisos Android, conexión y respuesta de voz en el dispositivo real.","ia":"Explica errores y alucinaciones posibles; revisa resultados importantes con fuentes y supervisión humana.","nival":"Comprueba los requisitos fiscales y los procesos de caja y facturación aplicables antes de ofrecer el módulo.","luna":"Distingue acompañamiento de bienestar de atención sanitaria; no atribuyas diagnóstico o tratamiento.","mediciones":"Verifica dispositivo, versión del sistema, permisos y privacidad de datos de salud.","force":"Solicita nombre del CRM, versión, permisos y prueba una integración limitada antes de prometer sincronización.","cita":"Valida calendario, destinatario, canal autorizado, consentimiento y entrega de un recordatorio de prueba.","apuestas":"No prometas beneficios; distingue simulación de apuestas reales y verifica requisitos regulatorios."};const sel=document.querySelector("#caso"),q=document.querySelector("#pregunta"),result=document.querySelector("#resultado");const key="academy360-practicas-v1";let completadas={};try{const saved=JSON.parse(localStorage.getItem(key)||"{}");if(saved&&typeof saved==="object"&&!Array.isArray(saved))completadas=Object.fromEntries(Object.entries(saved).filter(([k,v])=>Object.prototype.hasOwnProperty.call(cases,k)&&v===true))}catch{}function siguientePendiente(){return Object.keys(cases).find(k=>!completadas[k])}function renderProgreso(){document.querySelector("#progreso").textContent="Ejercicios superados en este dispositivo: "+Object.keys(completadas).length+" de "+Object.keys(cases).length;const next=siguientePendiente();document.querySelector("#ir-siguiente").disabled=!next;document.querySelector("#siguiente").textContent=next?"Siguiente ejercicio recomendado: "+document.querySelector('#caso option[value="'+next+'"]').textContent:"¡Has superado todos los ejercicios disponibles!"}document.querySelector("#reiniciar").addEventListener("click",()=>{if(confirm("¿Reiniciar el progreso guardado en este dispositivo?")){completadas={};localStorage.removeItem(key);renderProgreso();result.textContent=""}});function update(){q.textContent=cases[sel.value];result.textContent="";document.querySelector("#test").reset()}const requested=new URLSearchParams(location.search).get("caso");if(Object.prototype.hasOwnProperty.call(cases,requested))sel.value=requested;sel.addEventListener("change",update);document.querySelector("#ir-siguiente").addEventListener("click",()=>{const next=siguientePendiente();if(next){sel.value=next;update();document.querySelector("#pregunta").scrollIntoView({behavior:"smooth",block:"start"})}});document.querySelector("#test").addEventListener("submit",e=>{e.preventDefault();result.textContent=new FormData(e.currentTarget).get("respuesta")==="b"?"Correcto. "+consejos[sel.value]:"Revisa la respuesta. "+consejos[sel.value];if(new FormData(e.currentTarget).get("respuesta")==="b"){completadas[sel.value]=true;try{localStorage.setItem(key,JSON.stringify(completadas))}catch{}renderProgreso()}});update();renderProgreso()</script></body></html>
